<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stateside TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Layout idea: an American broadcast test card. Colour bars run under the masthead,
     the page sits on broadcast blue, and big poster type leads each screen. */
  :root {
    color-scheme: dark;
    --night: #0d1552;
    --deep: #090f3d;
    --panel: #18227a;
    --line: #38439f;
    --paper: #f8f5e8;
    --muted: #c0c6ea;
    --signal: #ffd23f;
    --signal-ink: #1b1600;
    --red: #ff5c70;
    --red-ink: #2a0309;
    --cyan: #5fdcea;
    --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
    --body: "Public Sans", "Segoe UI", Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html { background: var(--night); }
  body { margin: 0; background: var(--night); color: var(--paper); font: 400 16px/1.55 var(--body); }
  h1, h2, h3, p { margin: 0; }
  h1, h2, h3 { font-family: var(--display); font-weight: 800; line-height: .98; text-wrap: balance; }
  h1 { font-size: clamp(3rem, 8vw, 5.5rem); }
  h2 { font-size: clamp(2rem, 4vw, 2.75rem); }
  a { color: var(--signal); text-underline-offset: 3px; }
  img { display: block; max-width: 100%; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
  main:focus { outline: none; }

  .wrap { width: min(1240px, 100%); margin: 0 auto; padding-inline: 20px; }

  /* Masthead */
  .mast { position: sticky; top: 0; z-index: 10; background: var(--deep); }
  .mast-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 28px; padding-block: 10px; }
  .brand { color: var(--paper); font: 900 2.125rem/.9 var(--display); text-decoration: none; }
  .brand span { display: block; margin-top: 3px; color: var(--muted); font: 500 .75rem/1.2 var(--body); }
  .nav { display: flex; gap: 2px; }
  .nav a { padding: 8px 12px; color: var(--muted); font-weight: 600; text-decoration: none; }
  .nav a:hover { color: var(--paper); }
  .nav a[aria-current="page"] { background: var(--signal); color: var(--signal-ink); }
  .search { display: flex; flex: 1 1 240px; justify-content: flex-end; }
  .search input { flex: 0 1 280px; min-width: 0; min-height: 42px; padding: 6px 12px; background: var(--paper); border: 0; border-radius: 3px 0 0 3px; color: #151a44; }
  .search input::placeholder { color: #4c5278; }
  .search button { min-height: 42px; padding: 6px 16px; background: var(--signal); border: 0; border-radius: 0 3px 3px 0; color: var(--signal-ink); font-weight: 700; }
  .bars {
    height: 8px; transform-origin: left;
    background: linear-gradient(90deg,
      #c9c9c9 0 14.28%, #d6c400 14.28% 28.57%, #00bcc9 28.57% 42.85%, #00b84a 42.85% 57.14%,
      #c424b6 57.14% 71.42%, #d3202f 71.42% 85.71%, #1d38d6 85.71% 100%);
  }
  @media (prefers-reduced-motion: no-preference) {
    .bars { animation: sweep .7s cubic-bezier(.2, .7, .2, 1) both; }
    @keyframes sweep { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  }

  main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 52px; padding-block: 32px 56px; }
  .stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; min-width: 0; }
  .heading { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
  .muted { color: var(--muted); }
  .small { font-size: .875rem; }
  .panel { padding: 28px; background: var(--panel); border-radius: 4px; }

  /* Home spotlight */
  .spotlight { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 40px; align-items: end; padding: 44px; overflow: hidden; background: var(--deep); isolation: isolate; }
  .backdrop { position: absolute; inset: -40px; z-index: -2; width: calc(100% + 80px); max-width: none; height: calc(100% + 80px); object-fit: cover; filter: blur(28px) saturate(1.2); opacity: .55; }
  .spotlight::after, .hero::after { content: ""; position: absolute; inset: 0; z-index: -1; background: rgba(9, 15, 61, .62); }
  .spotlight-copy { display: grid; justify-items: start; gap: 16px; min-width: 0; }
  .kicker { color: var(--signal); font-weight: 700; }
  .spotlight-title { font-size: clamp(3.5rem, 10vw, 8.5rem); font-weight: 900; line-height: .88; }
  .spotlight-text { display: -webkit-box; max-width: 62ch; overflow: hidden; -webkit-box-orient: vertical; -webkit-line-clamp: 3; }
  .spotlight .poster { box-shadow: 14px 14px 0 var(--signal); }
  .skeleton { background: var(--panel); }
  .spotlight-skeleton { min-height: 520px; }

  /* Posters */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 30px 20px; }
  .card { display: grid; align-content: start; gap: 8px; min-width: 0; color: inherit; text-decoration: none; }
  .poster-frame { position: relative; display: block; }
  .poster { width: 100%; aspect-ratio: 210 / 295; object-fit: cover; background: var(--panel); border-radius: 2px; }
  .card:hover .poster { outline: 3px solid var(--signal); outline-offset: 3px; }
  .card:hover .card-name { color: var(--signal); }
  .no-poster { display: grid; place-items: center; padding: 10px; color: var(--muted); font-size: .875rem; text-align: center; }
  .score { position: absolute; left: 0; bottom: 10px; padding: 1px 8px 1px 6px; background: var(--signal); color: var(--signal-ink); font-size: .875rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .card-name { font: 800 1.375rem/1.02 var(--display); }
  .card-meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 8px; color: var(--muted); font-size: .875rem; font-variant-numeric: tabular-nums; }
  .tag { justify-self: start; padding: 0 6px; background: var(--cyan); border-radius: 2px; color: #04262b; font-size: .75rem; font-weight: 700; }

  /* Ranked shelf */
  .shelf { display: grid; grid-auto-flow: column; grid-auto-columns: 250px; gap: 8px; margin-inline: -20px; padding: 6px 20px 14px; overflow-x: auto; scroll-snap-type: x proximity; scrollbar-color: var(--line) transparent; }
  .rank { display: grid; grid-template-columns: 82px 168px; align-items: start; scroll-snap-align: start; }
  .rank-number { margin: 155px 6px 0 0; color: var(--night); font: 900 6.5rem/.76 var(--display); text-align: right; -webkit-text-stroke: 2px var(--signal); font-variant-numeric: tabular-nums; }
  .rank .card { position: relative; }
  .rank .score { left: auto; right: 0; }

  /* Controls */
  .filters { display: flex; flex-wrap: wrap; align-items: end; gap: 14px; }
  .control { display: grid; gap: 3px; font-size: .875rem; font-weight: 600; }
  .control select, .control input { min-height: 44px; min-width: 150px; max-width: 100%; padding: 6px 10px; background: var(--deep); border: 1px solid var(--muted); border-radius: 3px; font-weight: 400; }
  .check { display: flex; align-items: center; gap: 8px; min-height: 40px; font-size: .9375rem; }
  .check input { flex: none; width: 20px; height: 20px; accent-color: var(--signal); }
  .button { display: inline-block; min-height: 46px; padding: 10px 20px; background: var(--signal); border: 2px solid var(--signal); border-radius: 3px; color: var(--signal-ink); font-weight: 700; line-height: 1.5; text-decoration: none; }
  .button:hover { background: var(--paper); border-color: var(--paper); }
  .button.secondary { background: transparent; border-color: var(--paper); color: var(--paper); }
  .button.secondary:hover { background: var(--paper); color: var(--night); }
  .button:disabled { opacity: .65; cursor: wait; }
  .browse { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { min-height: 40px; padding: 6px 14px; background: var(--panel); border: 0; border-radius: 3px; font-weight: 600; }
  .chip:hover { background: var(--paper); color: var(--night); }
  .chip[aria-pressed="true"] { background: var(--signal); color: var(--signal-ink); }

  /* Schedule */
  .day-strip { display: grid; grid-template-columns: repeat(7, minmax(72px, 1fr)); gap: 4px; overflow-x: auto; }
  .day { display: grid; gap: 2px; min-height: 76px; padding: 8px 6px; background: var(--panel); border: 0; border-radius: 2px; font-size: .875rem; font-weight: 600; }
  .day strong { font: 800 2rem/1 var(--display); font-variant-numeric: tabular-nums; }
  .day:hover { background: var(--line); }
  .day[aria-pressed="true"] { background: var(--signal); color: var(--signal-ink); }
  .listing { display: grid; grid-template-columns: minmax(0, 1fr); }
  .tonight { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 40px; }
  .slot { display: grid; grid-template-columns: 112px 54px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
  .tonight .slot { grid-template-columns: 96px 54px minmax(0, 1fr); }
  .tonight .slot-channel { grid-column: 3; margin-top: -10px; text-align: left; }
  .slot-time { font: 800 1.5rem/1 var(--display); font-variant-numeric: tabular-nums; }
  .slot-time small { display: block; margin-top: 4px; color: var(--muted); font: 400 .75rem/1.2 var(--body); }
  .slot img, .slot .thumb { width: 54px; height: 76px; object-fit: cover; background: var(--panel); border-radius: 2px; }
  .slot-name { color: var(--paper); font: 800 1.375rem/1.05 var(--display); text-decoration: none; }
  .slot-name:hover { color: var(--signal); }
  .slot-channel { color: var(--muted); font-size: .875rem; text-align: right; }
  .on-now { display: inline-block; margin-top: 5px; padding: 0 6px; background: var(--red); border-radius: 2px; color: var(--red-ink); font: 700 .75rem/1.5 var(--body); }

  /* Show page */
  .hero { position: relative; display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 44px; padding: 44px; overflow: hidden; background: var(--deep); isolation: isolate; }
  .hero > .poster { box-shadow: 12px 12px 0 var(--signal); }
  .hero-body { display: grid; align-content: start; gap: 18px; min-width: 0; }
  .genres { display: flex; flex-wrap: wrap; gap: 6px; }
  .genre { padding: 1px 9px; background: rgba(248, 245, 232, .14); border-radius: 2px; font-size: .875rem; }
  .prose { max-width: 68ch; }
  .facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px 20px; margin: 0; padding-block: 16px; border-block: 1px solid rgba(248, 245, 232, .3); }
  .facts dt { color: var(--muted); font-size: .8125rem; }
  .facts dd { margin: 0; font-size: 1.0625rem; font-weight: 700; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  .votes { display: block; color: var(--muted); font-size: .8125rem; font-weight: 400; }
  .running { color: var(--signal); }
  .next { padding: 10px 14px; background: var(--deep); border-left: 5px solid var(--signal); }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 2px solid var(--line); }
  .tabs a { padding: 10px 16px; color: var(--muted); font-weight: 700; text-decoration: none; }
  .tabs a:hover { color: var(--paper); }
  .tabs a[aria-current="page"] { background: var(--signal); color: var(--signal-ink); }
  .episode { border-bottom: 1px solid var(--line); }
  .episode summary { display: grid; grid-template-columns: 70px minmax(0, 1fr) 112px 44px; gap: 12px; align-items: baseline; padding: 12px 2px; cursor: pointer; }
  .episode summary::-webkit-details-marker { display: none; }
  .episode summary:hover .ep-name { color: var(--signal); }
  .ep-small { color: var(--muted); font-size: .875rem; font-variant-numeric: tabular-nums; }
  .ep-name { font-weight: 600; }
  .ep-rating { text-align: right; }
  .ep-text { max-width: 70ch; padding: 0 2px 16px 82px; color: var(--muted); }
  .cast { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px 24px; margin: 0; padding: 0; list-style: none; }
  .person { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: center; }
  .face { width: 64px; height: 64px; object-fit: cover; background: var(--panel); border-radius: 50%; }
  .person-name { font-weight: 700; line-height: 1.25; }

  footer { padding-block: 22px; border-top: 1px solid var(--line); color: var(--muted); font-size: .875rem; }

  @media (max-width: 900px) {
    .spotlight { grid-template-columns: minmax(0, 1fr) 190px; gap: 24px; padding: 28px; }
    .hero { grid-template-columns: 220px minmax(0, 1fr); gap: 28px; padding: 28px; }
    .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .tonight, .browse { grid-template-columns: minmax(0, 1fr); }
    .slot { grid-template-columns: 90px 54px minmax(0, 1fr); }
    .slot-channel { grid-column: 3; margin-top: -10px; text-align: left; }
  }
  @media (max-width: 620px) {
    .wrap { padding-inline: 16px; }
    main { gap: 40px; padding-block: 20px 40px; }
    .mast { position: static; }
    .nav { width: 100%; }
    .nav a { flex: 1; padding-inline: 4px; text-align: center; }
    .search { flex: 1 1 100%; width: 100%; min-width: 0; }
    .search input { flex: 1 1 0; width: 100%; }
    .spotlight { grid-template-columns: minmax(0, 1fr); margin-inline: -16px; padding: 24px 16px 28px; }
    .spotlight-poster { order: -1; width: 170px; }
    .spotlight .poster { box-shadow: 8px 8px 0 var(--signal); }
    .hero { grid-template-columns: minmax(0, 1fr); margin-inline: -16px; padding: 24px 16px; }
    .hero > .poster { width: 170px; box-shadow: 8px 8px 0 var(--signal); }
    .shelf { margin-inline: -16px; padding-inline: 16px; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 14px; }
    .panel { padding: 20px; }
    .control, .control select, .control input { width: 100%; }
    .episode summary { grid-template-columns: 58px minmax(0, 1fr) 36px; }
    .episode summary .ep-date { grid-column: 2; grid-row: 2; }
    .ep-rating { grid-column: 3; grid-row: 1; }
    .ep-text { padding-left: 2px; }
  }
</style>

<script>
  // ---------------------------------------------------------------------------
  // Settings
  // ---------------------------------------------------------------------------
  const API_BASE = "https://api.tvmaze.com";
  const REQUEST_GAP_MS = 550;     // Stays under TVmaze's limit of 20 calls per 10 seconds
  const FIRST_CATALOG_PAGES = 4;  // Each page holds up to 250 shows from every country
  const PAGE_SIZE = 48;
  const US_TIME_ZONE = "America/New_York";
  const WATCHLIST_KEY = "statesideWatchlist";
  const GLOBAL_KEY = "statesideIncludeGlobal";

  // OMDb supplies the IMDb ratings. The free key allows 1,000 requests a day.
  const OMDB_KEY = "b70defa1";
  const IMDB_CACHE_KEY = "statesideImdbRatings";
  const IMDB_CACHE_MS = 24 * 60 * 60 * 1000; // Saved ratings are reused for one day

  const view = document.getElementById("view");

  // ---------------------------------------------------------------------------
  // The American-only rule: every show on the site passes through this function
  // ---------------------------------------------------------------------------

  // "us"     = the show's network or web channel is registered in the United States
  // "global" = English-language show on a worldwide streamer such as Netflix,
  //            where TVmaze leaves the country empty, so its origin can't be confirmed
  // "other"  = anything else
  function classifyShow(show) {
    const channel = show.network || show.webChannel;
    const code = channel?.country?.code;
    if (code) return code === "US" ? "us" : "other";
    if (show.webChannel && show.language === "English") return "global";
    return "other";
  }

  function isAllowed(show) {
    const kind = classifyShow(show);
    return kind === "us" || (kind === "global" && settings.includeGlobal);
  }

  // ---------------------------------------------------------------------------
  // Talking to the API
  // ---------------------------------------------------------------------------
  class ApiError extends Error {
    constructor(status) {
      super(`TVmaze returned ${status}`);
      this.status = status;
    }
  }

  const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  const responses = new Map(); // Remembers answers so repeat visits make no new calls
  let requestQueue = Promise.resolve();

  async function sendRequest(path) {
    for (let attempt = 1; attempt <= 3; attempt++) {
      const response = await fetch(API_BASE + path);
      if (response.ok) return response.json();
      if (response.status !== 429 || attempt === 3) throw new ApiError(response.status);
      await wait(3000 * attempt); // Too many requests: pause, then try again
    }
  }

  // Requests go one at a time, with a short gap between them
  function api(path) {
    if (responses.has(path)) return responses.get(path);
    const job = requestQueue.then(() => sendRequest(path));
    requestQueue = job.catch(() => {}).then(() => wait(REQUEST_GAP_MS));
    responses.set(path, job);
    job.catch(() => responses.delete(path));
    return job;
  }

  // The show index can't be filtered by country, so pages are loaded and filtered here
  const catalog = { shows: new Map(), nextPage: 0, finished: false, loading: null };

  function loadCatalogPages(count) {
    if (catalog.loading) return catalog.loading;
    catalog.loading = (async () => {
      for (let i = 0; i < count && !catalog.finished; i++) {
        try {
          const page = await api(`/shows?page=${catalog.nextPage}`);
          page.forEach((show) => catalog.shows.set(show.id, show));
          catalog.nextPage++;
        } catch (error) {
          if (error.status !== 404) throw error;
          catalog.finished = true; // A 404 marks the end of the index
        }
      }
    })().finally(() => { catalog.loading = null; });
    return catalog.loading;
  }

  async function ensureCatalog() {
    if (catalog.nextPage < FIRST_CATALOG_PAGES && !catalog.finished) {
      await loadCatalogPages(FIRST_CATALOG_PAGES - catalog.nextPage);
    }
  }

  // ---------------------------------------------------------------------------
  // Saved settings and watchlist
  // ---------------------------------------------------------------------------
  function readSaved(key, fallback) {
    try {
      const value = JSON.parse(localStorage.getItem(key));
      return value === null ? fallback : value;
    } catch {
      return fallback;
    }
  }

  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* Works for this visit only */ }
  }

  const settings = { includeGlobal: readSaved(GLOBAL_KEY, false) === true };
  let watchlist = readSaved(WATCHLIST_KEY, []);
  if (!Array.isArray(watchlist)) watchlist = [];

  const isWatched = (id) => watchlist.some((show) => show.id === id);

  function toggleWatched(show) {
    if (isWatched(show.id)) {
      watchlist = watchlist.filter((item) => item.id !== show.id);
    } else {
      const { id, name, image, rating, network, webChannel, premiered, language } = show;
      watchlist = [{ id, name, image, rating, network, webChannel, premiered, language }, ...watchlist];
    }
    save(WATCHLIST_KEY, watchlist);
  }

  // ---------------------------------------------------------------------------
  // Small helpers
  // ---------------------------------------------------------------------------

  // Creates an element. Text is added safely, so API data can't inject HTML.
  function el(tag, props = {}, ...children) {
    const node = document.createElement(tag);
    Object.assign(node, props);
    node.append(...children.flat().filter((child) => child !== null && child !== undefined && child !== false));
    return node;
  }

  // TVmaze summaries contain HTML tags like <p>. This keeps only the words.
  function plainText(html) {
    if (!html) return "";
    return new DOMParser().parseFromString(html, "text/html").body.textContent.trim();
  }

  const channelName = (show) => show.network?.name || show.webChannel?.name || "Unknown channel";
  const ratingOf = (show) => show.rating?.average || 0;
  const yearOf = (show) => (show.premiered ? show.premiered.slice(0, 4) : "");

  function formatDate(isoDate) {
    if (!isoDate) return "Date unknown";
    const date = new Date(`${isoDate}T12:00:00`);
    if (Number.isNaN(date.getTime())) return "Date unknown";
    return date.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
  }

  function episodeCode(episode) {
    return episode.number ? `S${episode.season} E${episode.number}` : `S${episode.season} special`;
  }

  // Today's date as it is in the United States (Eastern Time)
  function usToday() {
    return new Intl.DateTimeFormat("en-CA", { timeZone: US_TIME_ZONE, year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
  }

  function shiftDate(isoDate, days) {
    const date = new Date(`${isoDate}T12:00:00Z`);
    date.setUTCDate(date.getUTCDate() + days);
    return date.toISOString().slice(0, 10);
  }

  const easternTime = (stamp) => new Date(stamp).toLocaleTimeString("en-US", { timeZone: US_TIME_ZONE, hour: "numeric", minute: "2-digit" });
  const yourTime = (stamp) => new Date(stamp).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  const easternHour = (stamp) => Number(new Intl.DateTimeFormat("en-US", { timeZone: US_TIME_ZONE, hour: "numeric", hourCycle: "h23" }).format(new Date(stamp)));

  function safeLink(url, label) {
    if (!/^https?:\/\//i.test(url || "")) return null;
    return el("a", { href: url, target: "_blank", rel: "noopener" }, label);
  }

  function poster(show) {
    return show.image?.medium
      ? el("img", { className: "poster", src: show.image.medium, alt: "", loading: "lazy" })
      : el("div", { className: "poster no-poster" }, "No poster");
  }

  function largePoster(show) {
    const source = show.image?.original || show.image?.medium;
    return source
      ? el("img", { className: "poster", src: source, alt: `${show.name} poster` })
      : el("div", { className: "poster no-poster" }, "No poster");
  }

  function backdrop(show) {
    const source = show.image?.medium || show.image?.original;
    return source ? el("img", { className: "backdrop", src: source, alt: "" }) : null;
  }

  function showCard(show) {
    return el("a", { className: "card", href: `#show/${show.id}` },
      el("span", { className: "poster-frame" },
        poster(show),
        ratingOf(show) ? el("span", { className: "score", title: "Rating out of 10" }, `★ ${Number(show.rating.average).toFixed(1)}`) : null),
      el("span", { className: "card-name" }, show.name),
      el("span", { className: "card-meta" },
        el("span", {}, channelName(show)),
        el("span", {}, yearOf(show))
      ),
      classifyShow(show) === "global" ? el("span", { className: "tag" }, "Global streamer") : null
    );
  }

  function posterSkeleton(count) {
    return el("div", { className: "grid", role: "status", ariaLabel: "Loading shows" },
      Array.from({ length: count }, () => el("div", { className: "poster skeleton" })));
  }

  function globalToggle() {
    const box = el("input", { type: "checkbox", id: "include-global", checked: settings.includeGlobal });
    box.addEventListener("change", () => {
      settings.includeGlobal = box.checked;
      save(GLOBAL_KEY, box.checked);
      renderRoute();
    });
    return el("label", { className: "check", htmlFor: "include-global" }, box, "Include English-language shows on global streamers");
  }

  function loading(text) {
    return el("p", { className: "muted", role: "status" }, text);
  }

  function messagePanel(title, text, ...actions) {
    return el("section", { className: "panel stack" }, el("h1", {}, title), el("p", {}, text),
      actions.length ? el("div", { className: "actions" }, actions) : null);
  }

  function errorPanel() {
    const retry = el("button", { className: "button", type: "button" }, "Try again");
    retry.addEventListener("click", renderRoute);
    return messagePanel("Couldn't load this page", "TVmaze didn't respond. Check your internet connection, then try again.", retry);
  }

  // ---------------------------------------------------------------------------
  // Home
  // ---------------------------------------------------------------------------
  // TVmaze's "weight" measures popularity, which keeps obscure one-vote shows out of the top spots
  function rankShows(shows) {
    const popular = shows.filter((show) => (show.weight || 0) >= 80 && ratingOf(show));
    const pool = popular.length >= 10 ? popular : shows;
    return [...pool].sort((a, b) => ratingOf(b) - ratingOf(a));
  }

  function spotlight(show) {
    return el("section", { className: "spotlight" },
      backdrop(show),
      el("div", { className: "spotlight-copy" },
        el("p", { className: "kicker" }, "Highest-rated American series"),
        el("h1", { className: "spotlight-title" }, show.name),
        el("p", { className: "spotlight-text" }, plainText(show.summary) || `${show.name} airs on ${channelName(show)}.`),
        el("a", { className: "button", href: `#show/${show.id}` }, "View series")),
      el("div", { className: "spotlight-poster" }, largePoster(show))
    );
  }

  function rankedCard(show, index) {
    return el("div", { className: "rank" },
      el("span", { className: "rank-number", ariaHidden: "true" }, String(index + 1)),
      showCard(show));
  }

  function browseChip(label, change) {
    const chip = el("button", { className: "chip", type: "button" }, label);
    chip.addEventListener("click", () => {
      Object.assign(filters, { genre: "", status: "", channel: "", visible: PAGE_SIZE }, change);
      location.hash = "shows";
    });
    return chip;
  }

  function mostCommon(values, limit) {
    const counts = new Map();
    values.forEach((value) => counts.set(value, (counts.get(value) || 0) + 1));
    return [...counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, limit).map(([value]) => value);
  }

  async function renderHome(isCurrent) {
    document.title = "Stateside TV";
    const spotlightBox = el("div", {}, el("div", { className: "skeleton spotlight-skeleton", role: "status", ariaLabel: "Loading the featured series" }));
    const tonightBox = el("div", { className: "stack" }, loading("Loading tonight's schedule…"));
    const topBox = el("div", { className: "stack" }, posterSkeleton(6));
    const browseBox = el("div", { className: "browse" });
    view.replaceChildren(
      spotlightBox,
      el("section", { className: "stack" },
        el("div", { className: "heading" }, el("h2", {}, "Tonight on American TV"), el("a", { href: "#schedule" }, "Full schedule")),
        tonightBox),
      el("section", { className: "stack" },
        el("div", { className: "heading" }, el("h2", {}, "Top 10 American series"), el("a", { href: "#shows" }, "Browse all shows")),
        topBox),
      browseBox
    );

    try {
      const episodes = await loadSchedule(usToday());
      if (!isCurrent()) return;
      const primetime = episodes.filter((episode) => episode.airtime && easternHour(episode.airstamp) >= 19);
      const picks = (primetime.length ? primetime : episodes).slice(0, 6);
      tonightBox.replaceChildren(picks.length
        ? el("div", { className: "listing tonight" }, picks.map(scheduleRow))
        : el("p", { className: "muted" }, "No American episodes are listed for tonight."));
    } catch {
      if (isCurrent()) tonightBox.replaceChildren(el("p", { className: "muted" }, "Tonight's schedule isn't available right now."));
    }

    await ensureCatalog();
    if (!isCurrent()) return;
    const shows = allowedCatalog();
    const ranked = rankShows(shows);
    if (ranked.length) spotlightBox.replaceChildren(spotlight(ranked[0]));
    else spotlightBox.replaceChildren();

    topBox.replaceChildren(el("div", { className: "shelf", tabIndex: 0, role: "region", ariaLabel: "Top 10 American series" },
      ranked.slice(0, 10).map(rankedCard)));

    browseBox.replaceChildren(
      el("section", { className: "stack" }, el("h2", {}, "Browse by network"),
        el("div", { className: "chips" }, mostCommon(shows.map(channelName), 10).map((name) => browseChip(name, { channel: name })))),
      el("section", { className: "stack" }, el("h2", {}, "Browse by genre"),
        el("div", { className: "chips" }, mostCommon(shows.flatMap((show) => show.genres || []), 10).map((genre) => browseChip(genre, { genre }))))
    );
  }

  // ---------------------------------------------------------------------------
  // Browse shows
  // ---------------------------------------------------------------------------
  const filters = { genre: "", channel: "", status: "", sort: "rating", visible: PAGE_SIZE };

  const allowedCatalog = () => [...catalog.shows.values()].filter(isAllowed);

  function selectControl(id, label, value, options, onChange) {
    const select = el("select", { id },
      options.map(([optionValue, text]) => el("option", { value: optionValue, selected: optionValue === value }, text)));
    select.addEventListener("change", () => onChange(select.value));
    return el("label", { className: "control", htmlFor: id }, label, select);
  }

  async function renderShows(isCurrent) {
    document.title = "Shows · Stateside TV";
    view.replaceChildren(el("h1", {}, "American TV shows"), posterSkeleton(12));
    await ensureCatalog();
    if (isCurrent()) drawShows();
  }

  function drawShows() {
    const shows = allowedCatalog();
    const unique = (values) => [...new Set(values.filter(Boolean))].sort((a, b) => a.localeCompare(b));
    const update = (key) => (value) => {
      filters[key] = value;
      filters.visible = PAGE_SIZE;
      drawShows();
    };

    const matches = shows.filter((show) =>
      (!filters.genre || show.genres?.includes(filters.genre)) &&
      (!filters.channel || channelName(show) === filters.channel) &&
      (!filters.status || show.status === filters.status));

    const sorters = {
      rating: (a, b) => ratingOf(b) - ratingOf(a),
      newest: (a, b) => (b.premiered || "").localeCompare(a.premiered || ""),
      name: (a, b) => a.name.localeCompare(b.name)
    };
    matches.sort(sorters[filters.sort]);

    const more = el("button", { className: "button secondary", type: "button" }, "Load more series");
    more.addEventListener("click", async () => {
      if (filters.visible < matches.length) {
        filters.visible += PAGE_SIZE;
        drawShows();
        return;
      }
      more.disabled = true;
      more.textContent = "Loading…";
      try {
        await loadCatalogPages(2);
        filters.visible += PAGE_SIZE;
        if (currentRoute().name === "shows") drawShows();
      } catch {
        more.disabled = false;
        more.textContent = "Couldn't load more. Try again";
      }
    });

    view.replaceChildren(
      el("h1", {}, "American TV shows"),
      el("section", { className: "stack" },
        el("div", { className: "filters" },
          selectControl("filter-genre", "Genre", filters.genre, [["", "All genres"], ...unique(shows.flatMap((s) => s.genres || [])).map((v) => [v, v])], update("genre")),
          selectControl("filter-channel", "Network", filters.channel, [["", "All networks"], ...unique(shows.map(channelName)).map((v) => [v, v])], update("channel")),
          selectControl("filter-status", "Status", filters.status, [["", "Any status"], ...unique(shows.map((s) => s.status)).map((v) => [v, v])], update("status")),
          selectControl("filter-sort", "Sort by", filters.sort, [["rating", "Highest rated"], ["newest", "Newest premiere"], ["name", "Name, A to Z"]], update("sort"))
        ),
        globalToggle(),
        el("p", { className: "muted small", role: "status" }, `${matches.length} American series found in the ${catalog.shows.size} shows loaded so far`),
        matches.length
          ? el("div", { className: "grid" }, matches.slice(0, filters.visible).map(showCard))
          : el("p", { className: "muted" }, "No loaded series match these filters. Load more series or change a filter."),
        (filters.visible < matches.length || !catalog.finished) ? el("div", {}, more) : null
      )
    );
  }

  // ---------------------------------------------------------------------------
  // Schedule
  // ---------------------------------------------------------------------------
  let scheduleDate = null;

  // Broadcast and US streaming always load. Global streamers load only when switched on.
  async function loadSchedule(date) {
    const requests = [api(`/schedule?country=US&date=${date}`), api(`/schedule/web?country=US&date=${date}`)];
    if (settings.includeGlobal) requests.push(api(`/schedule/web?country=&date=${date}`));
    const lists = await Promise.all(requests);

    const seen = new Set();
    return lists.flat()
      .map((episode) => ({ ...episode, show: episode.show || episode._embedded?.show }))
      .filter((episode) => {
        if (!episode.show || seen.has(episode.id) || !isAllowed(episode.show)) return false;
        seen.add(episode.id);
        return true;
      })
      .sort((a, b) => (a.airstamp || "").localeCompare(b.airstamp || ""));
  }

  function scheduleRow(episode) {
    const show = episode.show;
    const start = new Date(episode.airstamp).getTime();
    const end = start + (episode.runtime || 30) * 60000;
    const onNow = Boolean(episode.airtime) && Date.now() >= start && Date.now() < end;
    return el("div", { className: "slot" },
      el("div", { className: "slot-time" },
        episode.airtime && episode.airstamp
          ? [`${easternTime(episode.airstamp)} ET`, el("small", {}, `${yourTime(episode.airstamp)} your time`)]
          : "Any time"),
      show.image?.medium ? el("img", { src: show.image.medium, alt: "", loading: "lazy" }) : el("div", { className: "thumb" }),
      el("div", {},
        el("a", { className: "slot-name", href: `#show/${show.id}` }, show.name),
        el("div", { className: "muted small" }, `${episodeCode(episode)}: ${episode.name || "Untitled episode"}`),
        onNow ? el("span", { className: "on-now" }, "On now") : null),
      el("div", { className: "slot-channel" }, channelName(show))
    );
  }

  async function renderSchedule(isCurrent) {
    document.title = "Schedule · Stateside TV";
    scheduleDate = scheduleDate || usToday();

    const goTo = (date) => { scheduleDate = date; renderRoute(); };
    const days = Array.from({ length: 7 }, (_, index) => shiftDate(usToday(), index));
    const dayStrip = el("div", { className: "day-strip", role: "group", ariaLabel: "Choose a day" }, days.map((date, index) => {
      const weekday = new Date(`${date}T12:00:00Z`).toLocaleDateString("en-GB", { weekday: "short", timeZone: "UTC" });
      const button = el("button", { className: "day", type: "button", ariaLabel: formatDate(date) },
        el("span", {}, index === 0 ? "Today" : weekday),
        el("strong", {}, String(Number(date.slice(8)))));
      button.setAttribute("aria-pressed", String(date === scheduleDate));
      button.addEventListener("click", () => goTo(date));
      return button;
    }));
    const dateInput = el("input", { id: "schedule-date", type: "date", value: scheduleDate });
    dateInput.addEventListener("change", () => { if (dateInput.value) goTo(dateInput.value); });

    const listBox = el("div", { className: "stack" }, loading("Loading the schedule…"));
    view.replaceChildren(
      el("h1", {}, "American TV schedule"),
      el("section", { className: "stack" },
        dayStrip,
        el("div", { className: "filters" },
          el("label", { className: "control", htmlFor: "schedule-date" }, "Pick another date", dateInput),
          globalToggle()),
        listBox)
    );

    const episodes = await loadSchedule(scheduleDate);
    if (!isCurrent()) return;
    const isOnNetwork = (episode) => Boolean(episode.show.network);
    const section = (title, items) => items.length
      ? el("section", { className: "stack" }, el("h2", {}, `${title} (${items.length})`), el("div", { className: "listing" }, items.map(scheduleRow)))
      : null;
    const parts = [
      section("Network and cable", episodes.filter(isOnNetwork)),
      section("Streaming", episodes.filter((episode) => !isOnNetwork(episode)))
    ].filter(Boolean);
    listBox.replaceChildren(...(parts.length ? parts : [el("p", { className: "muted" }, `No American episodes are listed for ${formatDate(scheduleDate)}.`)]));
  }

  // ---------------------------------------------------------------------------
  // Search

      el("h1", {}, "Your watchlist"),

        ? el("div", { className: "grid" }, watchlist.map(showCard))

  // ---------------------------------------------------------------------------
  // Show page
  // ---------------------------------------------------------------------------
  async function renderShow(isCurrent, id, tab) {
    view.replaceChildren(loading("Loading the show…"));
    let show;
    try {
      show = await api(`/shows/${id}?embed[]=episodes&embed[]=cast&embed[]=nextepisode`);
    } catch (error) {
      if (error.status !== 404) throw error;
      if (isCurrent()) view.replaceChildren(messagePanel("Show not found", `TVmaze has no show with ID ${id}.`, el("a", { className: "button", href: "#shows" }, "Browse shows")));
      return;
    }
    if (!isCurrent()) return;

    document.title = `${show.name} · Stateside TV`;
    const kind = classifyShow(show);

    if (kind === "other") {
      const country = (show.network || show.webChannel)?.country?.name;
      view.replaceChildren(messagePanel(`${show.name} isn't on Stateside TV`,
        country ? `This site only lists American series, and this show comes from ${country}.` : "This site only lists American series, and TVmaze doesn't list this show's country.",
        el("a", { className: "button", href: "#shows" }, "Browse American shows")));
      return;
    }
    if (kind === "global" && !settings.includeGlobal) {
      const enable = el("button", { className: "button", type: "button" }, "Include global streamers");
      enable.addEventListener("click", () => {
        settings.includeGlobal = true;
        save(GLOBAL_KEY, true);
        renderRoute();
      });
      view.replaceChildren(messagePanel(`${show.name} streams worldwide`,
        `${channelName(show)} is a global streamer, so TVmaze can't confirm this series is American.`, enable));
      return;
    }

    const episodes = show._embedded?.episodes || [];
    const cast = show._embedded?.cast || [];
    const tabLink = (key, label) => {
      const link = el("a", { href: `#show/${id}${key === "main" ? "" : `/${key}`}` }, label);
      if (key === tab) link.setAttribute("aria-current", "page");
      return link;
    };

    const content = tab === "episodes" ? episodeGuide(episodes)
      : tab === "cast" ? castList(cast)
      : el("div", { className: "stack" },
          el("h2", {}, "Main cast"),
          cast.length ? castList(cast.slice(0, 8)) : el("p", { className: "muted" }, "TVmaze has no cast listed for this show."),
          cast.length > 8 ? el("div", {}, el("a", { href: `#show/${id}/cast` }, `See all ${cast.length} cast members`)) : null);

    view.replaceChildren(
      showHero(show, episodes),
      el("section", { className: "stack" },
        el("nav", { className: "tabs", ariaLabel: "Show sections" },
          tabLink("main", "Overview"), tabLink("episodes", `Episodes (${episodes.length})`), tabLink("cast", `Cast (${cast.length})`)),
        content)
    );
  }

  // IMDb IDs look like tt0944947
  function imdbIdOf(show) {
    const id = show.externals?.imdb;
    return /^tt\d+$/.test(id || "") ? id : null;
  }

  const imdbRequests = new Map();

  // Each rating is requested once a day at most, which protects the daily OMDb limit
  function getImdbRating(imdbId) {
    if (imdbRequests.has(imdbId)) return imdbRequests.get(imdbId);

    const job = (async () => {
      const saved = readSaved(IMDB_CACHE_KEY, {});
      const earlier = saved[imdbId];
      if (earlier && Date.now() - earlier.savedAt < IMDB_CACHE_MS) return earlier;

      const response = await fetch(`https://www.omdbapi.com/?apikey=${OMDB_KEY}&i=${imdbId}`);
      const data = await response.json();
      if (data.Response === "False" && !response.ok) throw new Error(data.Error);
      if (data.Response !== "True" || !/^\d/.test(data.imdbRating || "")) return null;

      const result = { rating: data.imdbRating, votes: data.imdbVotes, savedAt: Date.now() };
      save(IMDB_CACHE_KEY, { ...readSaved(IMDB_CACHE_KEY, {}), [imdbId]: result });
      return result;
    })();

    imdbRequests.set(imdbId, job);
    job.catch(() => imdbRequests.delete(imdbId));
    return job;
  }

  function imdbRatingFact(show) {
    const imdbId = imdbIdOf(show);
    if (!imdbId) return "Not listed";

    const box = el("span", { id: "imdb-rating" }, "Loading…");
    getImdbRating(imdbId)
      .then((result) => {
        if (!result) {
          box.textContent = "Not rated";
          return;
        }
        const votes = /^\d/.test(result.votes || "") ? el("small", { className: "votes" }, `${result.votes} votes`) : null;
        box.replaceChildren(`${result.rating} / 10`, ...(votes ? [votes] : []));
      })
      .catch(() => { box.textContent = "Not available"; });
    return box;
  }

  function showHero(show, episodes) {
    const seasons = new Set(episodes.map((episode) => episode.season));
    const next = show._embedded?.nextepisode;
    const runtime = show.runtime || show.averageRuntime;
    const years = yearOf(show) && (show.ended ? `${yearOf(show)}–${show.ended.slice(0, 4)}` : show.status === "Running" ? `${yearOf(show)}–present` : yearOf(show));
    const facts = [
      ["Status", el("span", { className: show.status === "Running" ? "running" : "" }, show.status || "Unknown")],
      ["IMDb rating", imdbRatingFact(show)],
      ["TVmaze rating", ratingOf(show) ? `${show.rating.average} / 10` : "Not rated"],
      ["Network", channelName(show)],
      ["Schedule", show.schedule?.days?.length ? `${show.schedule.days.join(", ")}${show.schedule.time ? ` at ${show.schedule.time}` : ""}` : "Not set"],
      ["Episodes", `${episodes.length} in ${seasons.size} ${seasons.size === 1 ? "season" : "seasons"}`],
      ["Runtime", runtime ? `${runtime} min` : "Unknown"],
      ["Premiered", formatDate(show.premiered)]
    ];

    const watch = el("button", { className: "button", type: "button" });
    const drawWatch = () => { watch.textContent = isWatched(show.id) ? "Remove from watchlist" : "Add to watchlist"; };
    watch.addEventListener("click", () => { toggleWatched(show); drawWatch(); });
    drawWatch();

    return el("article", { className: "hero" },
      backdrop(show),
      largePoster(show),
      el("div", { className: "hero-body" },
        el("div", {},
          el("h1", {}, show.name),
          el("p", { className: "muted" }, [years, show.type, show.language].filter(Boolean).join(", "))),
        classifyShow(show) === "global" ? el("span", { className: "tag" }, "Global streamer: American origin not confirmed") : null,
        show.genres?.length ? el("div", { className: "genres" }, show.genres.map((genre) => el("span", { className: "genre" }, genre))) : null,
        el("p", { className: "prose" }, plainText(show.summary) || "No summary available."),
        el("dl", { className: "facts" }, facts.map(([label, value]) => el("div", {}, el("dt", {}, label), el("dd", {}, value)))),
        next ? el("p", { className: "next" }, el("strong", {}, "Next episode: "), `${episodeCode(next)}, ${next.name}, ${formatDate(next.airdate)}`) : null,
        el("div", { className: "actions" }, watch, safeLink(show.url, "View on TVmaze"),
          imdbIdOf(show) ? safeLink(`https://www.imdb.com/title/${imdbIdOf(show)}/`, "View on IMDb") : null,
          safeLink(show.officialSite, "Official site"))
      )
    );
  }

  function episodeGuide(episodes) {
    if (!episodes.length) return el("p", { className: "muted" }, "TVmaze has no episodes listed for this show.");
    const seasons = [...new Set(episodes.map((episode) => episode.season))].sort((a, b) => a - b);
    let selected = seasons[0];
    const list = el("div", {});

    function drawEpisodes() {
      list.replaceChildren(...episodes.filter((episode) => episode.season === selected).map((episode) =>
        el("details", { className: "episode" },
          el("summary", {},
            el("span", { className: "ep-small" }, episodeCode(episode)),
            el("span", { className: "ep-name" }, episode.name || "Untitled episode"),
            el("span", { className: "ep-small ep-date" }, formatDate(episode.airdate)),
            el("span", { className: "ep-small ep-rating" }, episode.rating?.average ? String(episode.rating.average) : "–")),
          el("p", { className: "ep-text" }, plainText(episode.summary) || "No summary available."))));
    }

    const bar = el("div", { className: "chips", role: "group", ariaLabel: "Choose a season" });
    seasons.forEach((season) => {
      const chip = el("button", { className: "chip", type: "button" }, `Season ${season}`);
      chip.setAttribute("aria-pressed", String(season === selected));
      chip.addEventListener("click", () => {
        selected = season;
        bar.querySelectorAll("button").forEach((item) => item.setAttribute("aria-pressed", String(item === chip)));
        drawEpisodes();
      });
      bar.append(chip);
    });
    drawEpisodes();
    return el("div", { className: "stack" }, bar, list);
  }

  function castList(cast) {
    if (!cast.length) return el("p", { className: "muted" }, "TVmaze has no cast listed for this show.");
    return el("ul", { className: "cast" }, cast.map((member) => {
      const photo = member.person?.image?.medium || member.character?.image?.medium;
      return el("li", { className: "person" },
        photo ? el("img", { className: "face", src: photo, alt: "", loading: "lazy" }) : el("div", { className: "face" }),
        el("div", {},
          el("div", { className: "person-name" }, member.person?.name || "Unknown"),
          el("div", { className: "muted small" }, member.character?.name ? `as ${member.character.name}` : "")));
    }));
  }

  // ---------------------------------------------------------------------------
  // Page navigation, based on the part of the address after #
  // ---------------------------------------------------------------------------
  function currentRoute() {
    const [name, ...rest] = location.hash.slice(1).split("/");
    if (name === "show" && /^\d+$/.test(rest[0] || "")) {
      return { name, id: Number(rest[0]), tab: ["episodes", "cast"].includes(rest[1]) ? rest[1] : "main" };
    }
    if (name === "search" && rest.length) {
      try {
        return { name, term: decodeURIComponent(rest.join("/")) };
      } catch {
        return { name: "home" };
      }
    }
    return { name: ["shows", "schedule", "watchlist"].includes(name) ? name : "home" };
  }

  let routeNumber = 0;

  async function renderRoute() {
    const thisRoute = ++routeNumber;
    const isCurrent = () => thisRoute === routeNumber; // Ignores slow answers after the page changes
    const route = currentRoute();

    document.querySelectorAll("[data-nav]").forEach((link) => {
      if (link.dataset.nav === route.name) link.setAttribute("aria-current", "page");
      else link.removeAttribute("aria-current");
    });

    try {
      if (route.name === "shows") await renderShows(isCurrent);
      else if (route.name === "schedule") await renderSchedule(isCurrent);
      else if (route.name === "watchlist") renderWatchlist();
      else if (route.name === "search") await renderSearch(isCurrent, route.term);
      else if (route.name === "show") await renderShow(isCurrent, route.id, route.tab);
      else await renderHome(isCurrent);
    } catch {
      if (isCurrent()) view.replaceChildren(errorPanel());
    }
  }

  document.getElementById("search-form").addEventListener("submit", (event) => {
    event.preventDefault();
    const term = document.getElementById("search-input").value.trim();
    if (term) location.hash = `search/${encodeURIComponent(term)}`;
  });

  window.addEventListener("hashchange", () => {
    window.scrollTo(0, 0);
    view.focus({ preventScroll: true });
    renderRoute();
  });

  renderRoute();
</script>
</body>
</html>
